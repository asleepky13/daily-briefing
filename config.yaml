      #   type: html
      #   url: "https://example.com/news/"
      #   selectors: { container: "article", title: "h2", link: "h2 a", date: "time", summary: "p" }

# Publisher names. `rename` tidies how a source is shown (left: name as it arrives, right: what you see).
# Website-style names you don't list (e.g. "toronto.citynews.ca") are shortened automatically ("Citynews").
# `block` drops a publisher everywhere. Names are matched without regard to capitals.
sources:
  rename:
    "reuters.com": "Reuters"
    "Bloomberg.com": "Bloomberg"
    "AP News": "AP"
    "CNBC Top News": "CNBC"
    "CNBC Finance": "CNBC"
    "CNBC Markets": "CNBC"
    "BBC World": "BBC"
    "The Guardian World": "The Guardian"
    "The Guardian Business": "The Guardian"
    "The Guardian Technology": "The Guardian"
    "NYT Business": "The New York Times"
    "NYT Technology": "The New York Times"
    "NYT World": "The New York Times"
    "The Globe and Mail Business": "The Globe and Mail"
    "The Globe and Mail Toronto": "The Globe and Mail"
    "The Globe and Mail Politics": "The Globe and Mail"
    "WSJ Markets": "The Wall Street Journal"
    "Financial Times Markets": "Financial Times"
    "Financial Times Companies": "Financial Times"
    "Financial Times Global Economy": "Financial Times"
    "Financial Times Lex": "Financial Times (Lex)"
    "Financial Times Technology": "Financial Times"
    "Financial Times World": "Financial Times"
    "The Economist Business": "The Economist"
    "The Economist Finance & Economics": "The Economist"
    "The Economist International": "The Economist"
    "Sky News World": "Sky News"
    "DW World": "DW"
    "NPR World": "NPR"
    "Global News Toronto": "Global News"
    "Global News Politics": "Global News"
    "Toronto Star GTA": "Toronto Star"
    "CBC Toronto": "CBC"
    "CBC Politics": "CBC"
    "SEC 8-K filings": "SEC EDGAR"
    "toronto.citynews.ca": "CityNews Toronto"
    "thecanadianpressnews.ca": "The Canadian Press"
    "pm.gc.ca": "Prime Minister of Canada"
    "taipeitimes.com": "Taipei Times"
    "edmontonjournal.com": "Edmonton Journal"
    "aptnnews.ca": "APTN News"
    "EnergyNow.com": "EnergyNow"
    "wsws.org": "World Socialist Web Site"
  block:
    - "World Socialist Web Site"
    - "MSN"            # re-publishes other outlets' stories

