# ─────────────────────────────────────────────────────────────────────────────
#  Daily Briefing configuration. This is the only file you need to edit.
#  After editing, commit the change; the next run picks it up.
# ─────────────────────────────────────────────────────────────────────────────

site:
  title: "Daily Briefing"
  # Used as the link inside the per-section RSS feeds. Set it to your Pages URL.
  base_url: "https://YOUR-GITHUB-NAME.github.io/daily-briefing/"
  timezone: "America/Toronto"

# Honest identification for publishers (SEC EDGAR requires a contact address).
user_agent: "DailyBriefingBot/1.0 (personal news digest; contact: you@example.com)"

update_every_hours: 4      # how often the briefing refreshes (the workflow checks hourly)
recency_hours: 12          # keep stories published within this many hours
max_items_per_section: 40  # stories (after de-duplication) shown per section
top_n: 5                   # "Top 5" size
retention_days: 90         # older daily files in data/ are deleted
similarity_threshold: 85   # 0-100; headlines at/above this are the same story

# Fills {city}, {province}, {country} in any Google News query below.
region:
  city: "Toronto"
  province: "Ontario"
  country: "Canada"

# Keyword rule syntax (case-insensitive, whole words only):
#   "series a" OR "series b"           quoted phrases, OR
#   acquisition AND (tech OR software) AND, parentheses
#   merger AND NOT opinion             NOT
#   re:raised \$\d+                    regular expression (rest of the rule, or re:"...")
# AND / OR / NOT must be written in CAPITALS.
# An item joins a section when ANY line under `keywords` matches,
# unless ANY line under `exclude` matches.
# `priority` words weigh 3x in ranking and trigger phone alerts (if ntfy is on).
# Feeds may set `require_keyword_match: false` to keep everything they publish.
# A feed can use `query:` instead of `url:` to become a Google News search feed.

sections:
  finance:
    name: "Finance"
    sign: "財經"        # neon signboard text (any short text works)
    enabled: true
    keywords:
      - stocks OR shares OR markets OR "wall street" OR tsx OR "s&p 500" OR nasdaq OR dow
      - earnings OR revenue OR profit OR guidance OR "quarterly results"
      - '"series a" OR "series b" OR "series c" OR "seed round" OR funding OR "venture capital"'
      - acquisition OR acquire OR acquires OR merger OR takeover OR buyout OR "m&a"
      - ipo OR "initial public offering" OR "goes public" OR listing
      - '"federal reserve" OR fed OR "bank of canada" OR ecb OR "central bank"'
      - '"interest rate" OR "rate cut" OR "rate hike" OR rates OR bonds OR yields'
      - inflation OR cpi OR recession OR gdp OR jobs OR unemployment
      - re:raised \$\d+
      - economy OR economic OR economists OR tariffs OR "trade war" OR "trade deal" OR exports OR imports
      - banks OR banking OR lender OR lenders OR debt OR default OR "credit rating" OR downgrade OR bankruptcy
      - oil OR opec OR gold OR dollar OR currency OR yen OR yuan OR euro OR commodities OR "treasury yields"
      - layoffs OR "job cuts" OR ceo OR "chief executive" OR regulators OR antitrust OR sanctions
    exclude:
      - opinion OR horoscope OR "sponsored content"
      # investing listicles and corporate housekeeping: noise for a high-level overview
      - '"stocks to buy" OR "stock to buy" OR "should you buy" OR "buy now" OR "millionaire" OR "passive income" OR "motley fool" OR "forever stock" OR "top pick" OR "price prediction"'
      - '"conference call" OR "to host" OR webcast OR "declares quarterly dividend" OR "declares dividend" OR "announces dividend" OR "investor day"'
      - '"submit a question" OR "ask our" OR quiz OR podcast OR newsletter OR "live blog" OR crossword'
    priority: [acquisition, merger, ipo, "rate cut", "rate hike", recession, tariffs, default, bankruptcy]
    # `weight` (0-3) ranks a feed's stories higher: wire services and the big financial papers first.
    feeds:
      - { name: "CNBC Top News", type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", weight: 2 }
      - { name: "CNBC Finance", type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664", require_keyword_match: false }
      - { name: "MarketWatch", type: rss, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", weight: 1 }
      - { name: "Yahoo Finance", type: rss, url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5EGSPC,%5EGSPTSE&region=US&lang=en-US" }
      - { name: "Financial Post", type: rss, url: "https://financialpost.com/feed", weight: 1 }
      - { name: "Reuters (via Google News)", type: rss, query: "site:reuters.com business OR markets when:1d", weight: 3 }
      - { name: "Bloomberg (via Google News)", type: rss, query: "site:bloomberg.com markets when:1d", weight: 3 }
      - { name: "WSJ Markets", type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain", require_keyword_match: false, weight: 3 }
      - { name: "Financial Times Markets", type: rss, url: "https://www.ft.com/markets?format=rss", require_keyword_match: false, weight: 3 }
      - { name: "Financial Times", type: rss, url: "https://www.ft.com/rss/home", weight: 3 }
      - { name: "Financial Times Companies", type: rss, url: "https://www.ft.com/companies?format=rss", weight: 3 }
      - { name: "Financial Times Global Economy", type: rss, url: "https://www.ft.com/global-economy?format=rss", require_keyword_match: false, weight: 3 }
      - { name: "Financial Times Lex", type: rss, url: "https://www.ft.com/lex?format=rss", weight: 2 }
      - { name: "The Economist Business", type: rss, url: "https://www.economist.com/business/rss.xml", weight: 2 }
      - { name: "The Economist Finance & Economics", type: rss, url: "https://www.economist.com/finance-and-economics/rss.xml", require_keyword_match: false, weight: 2 }
      - { name: "Nikkei Asia (via Google News)", type: rss, query: "site:asia.nikkei.com business OR markets OR economy when:1d", weight: 2 }
      - { name: "CNBC Markets", type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", require_keyword_match: false, weight: 2 }
      - { name: "The Globe and Mail Business", type: rss, url: "https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/business/", weight: 2 }
      - { name: "BNN Bloomberg", type: rss, url: "https://www.bnnbloomberg.ca/arc/outboundfeeds/rss/", weight: 2 }
      - { name: "NYT Business", type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml", weight: 2 }
      - { name: "The Guardian Business", type: rss, url: "https://www.theguardian.com/business/rss", weight: 1 }
      - { name: "Fortune", type: rss, url: "https://fortune.com/feed/" }
      - { name: "Seeking Alpha", type: rss, url: "https://seekingalpha.com/market_currents.xml" }
      - { name: "Investing.com", type: rss, url: "https://www.investing.com/rss/news_25.rss" }
      - { name: "Federal Reserve", type: rss, url: "https://www.federalreserve.gov/feeds/press_all.xml", require_keyword_match: false, weight: 2 }

  tech:
    name: "Tech"
    sign: "科技"        # neon signboard text (any short text works)
    enabled: true
    keywords:
      - ai OR "artificial intelligence" OR openai OR anthropic OR llm OR chatgpt OR gemini OR nvidia
      - startup OR startups OR "series a" OR "series b" OR funding OR "venture capital" OR unicorn
      - apple OR google OR alphabet OR microsoft OR amazon OR meta OR tesla OR "big tech"
      - launch OR launches OR unveils OR announces OR release OR releases
      - antitrust OR regulation OR regulators OR "eu commission" OR ftc OR "digital markets act"
      - breach OR hack OR hacked OR ransomware OR vulnerability OR exploit OR cyberattack OR "data leak"
      - chip OR chips OR semiconductor OR software OR cloud OR robotics
    exclude:
      - deal OR deals OR "gift guide" OR coupon OR "best buy" OR "prime day"
    priority: [breach, ransomware, acquisition, antitrust]
    feeds:
      - { name: "TechCrunch", type: rss, url: "https://techcrunch.com/feed/", require_keyword_match: false }
      - { name: "The Verge", type: rss, url: "https://www.theverge.com/rss/index.xml" }
      - { name: "Ars Technica", type: rss, url: "https://feeds.arstechnica.com/arstechnica/index" }
      - { name: "The Register", type: atom, url: "https://www.theregister.com/headlines.atom" }
      - { name: "Hacker News", type: rss, url: "https://hnrss.org/frontpage" }
      - { name: "Wired", type: rss, url: "https://www.wired.com/feed/rss" }
      - { name: "Krebs on Security", type: rss, url: "https://krebsonsecurity.com/feed/", require_keyword_match: false }
      - { name: "Reuters Tech (via Google News)", type: rss, query: "site:reuters.com technology when:1d" }
      - { name: "Engadget", type: rss, url: "https://www.engadget.com/rss.xml" }
      - { name: "Financial Times Technology", type: rss, url: "https://www.ft.com/technology?format=rss" }
      - { name: "MIT Technology Review", type: rss, url: "https://www.technologyreview.com/feed/", require_keyword_match: false }
      - { name: "BleepingComputer", type: rss, url: "https://www.bleepingcomputer.com/feed/", require_keyword_match: false }
      - { name: "The Hacker News (security)", type: rss, url: "https://feeds.feedburner.com/TheHackersNews", require_keyword_match: false }
      - { name: "NYT Technology", type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml", require_keyword_match: false }
      - { name: "The Guardian Technology", type: rss, url: "https://www.theguardian.com/technology/rss" }
      - { name: "ZDNet", type: rss, url: "https://www.zdnet.com/news/rss.xml" }
      - { name: "GeekWire", type: rss, url: "https://www.geekwire.com/feed/" }
      - { name: "BetaKit (Canadian tech)", type: rss, url: "https://betakit.com/feed/" }
      - { name: "9to5Mac", type: rss, url: "https://9to5mac.com/feed/" }
      - { name: "404 Media", type: rss, url: "https://www.404media.co/rss/", require_keyword_match: false }

  global:
    name: "Global Politics"
    sign: "國際"        # neon signboard text (any short text works)
    enabled: true
    keywords:
      - election OR elections OR vote OR voters OR ballot OR referendum OR campaign
      - diplomacy OR diplomatic OR summit OR talks OR treaty OR "united nations" OR un OR nato OR "g7" OR "g20"
      - war OR conflict OR ceasefire OR invasion OR strike OR strikes OR troops OR military OR missile
      - tariff OR tariffs OR "trade war" OR "trade deal" OR sanctions OR embargo
      - president OR "prime minister" OR parliament OR congress OR senate OR legislation OR bill OR law
      - government OR minister OR coup OR protest OR protests
    exclude:
      - opinion OR football OR soccer OR cricket OR recipe
    priority: [ceasefire, invasion, sanctions, coup]
    feeds:
      - { name: "BBC World", type: rss, url: "https://feeds.bbci.co.uk/news/world/rss.xml", require_keyword_match: false }
