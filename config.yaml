    - { t: "^GDAXI", name: "DAX (Germany)", region: "Europe" }
    - { t: "^FCHI", name: "CAC 40 (France)", region: "Europe" }
    - { t: "^N225", name: "Nikkei 225 (Japan)", region: "Asia-Pacific" }
    - { t: "^HSI", name: "Hang Seng (Hong Kong)", region: "Asia-Pacific" }
    - { t: "000001.SS", name: "Shanghai Composite", region: "Asia-Pacific" }
    - { t: "^KS11", name: "KOSPI (South Korea)", region: "Asia-Pacific" }
    - { t: "^BSESN", name: "Sensex (India)", region: "Asia-Pacific" }
