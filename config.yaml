    - { t: "CAD=X", name: "USD/CAD" }
  commodities:
    - { t: "BZ=F", name: "Brent crude" }
    - { t: "NG=F", name: "Natural gas" }
    - { t: "HG=F", name: "Copper" }
    - { t: "SI=F", name: "Silver" }
  canada_enabled: false        # true adds the row below
  canada:
    - { t: "^GSPTSE", name: "S&P/TSX" }
    - { t: "CAD=X", name: "USD/CAD" }
  magnificent7: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA]
