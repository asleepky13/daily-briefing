      - { name: "{province} legislature (via Google News)", type: rss, query: '"{province}" (premier OR legislature OR "Queen''s Park") when:1d' }
      - { name: "{country} Parliament (via Google News)", type: rss, query: '"{country}" (Parliament OR "House of Commons" OR "prime minister") when:1d' }
